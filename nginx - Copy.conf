server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /nasdaq/ {
        proxy_pass https://api.nasdaq.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.nasdaq.com;
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_set_header Accept "application/json,text/plain,*/*";
        proxy_set_header Referer "https://www.nasdaq.com/";
    }

    location /stocktwits/ {
        proxy_pass https://api.stocktwits.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.stocktwits.com;
        proxy_set_header Accept "application/json,text/plain,*/*";
    }

    location /yahoo/ {
        proxy_pass https://query1.finance.yahoo.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host query1.finance.yahoo.com;
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_set_header Accept "application/json,text/plain,*/*";
    }

    location /halts/ {
        proxy_pass https://www.nasdaqtrader.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host www.nasdaqtrader.com;
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_set_header Accept "application/rss+xml,text/xml,text/plain,*/*";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
