services:
  rocketscreeners:
    build:
      context: .
      args:
        VITE_ADSENSE_SLOT_DEFAULT: ${VITE_ADSENSE_SLOT_DEFAULT:-}
        VITE_ADSENSE_SLOT_DASHBOARD_TOP: ${VITE_ADSENSE_SLOT_DASHBOARD_TOP:-}
        VITE_ADSENSE_SLOT_DASHBOARD_IN_FEED: ${VITE_ADSENSE_SLOT_DASHBOARD_IN_FEED:-}
        VITE_ADSENSE_SLOT_GAINERS_TOP: ${VITE_ADSENSE_SLOT_GAINERS_TOP:-}
        VITE_ADSENSE_SLOT_GAINERS_BOTTOM: ${VITE_ADSENSE_SLOT_GAINERS_BOTTOM:-}
        VITE_ADSENSE_SLOT_LOSERS_TOP: ${VITE_ADSENSE_SLOT_LOSERS_TOP:-}
        VITE_ADSENSE_SLOT_LOSERS_BOTTOM: ${VITE_ADSENSE_SLOT_LOSERS_BOTTOM:-}
        VITE_ADSENSE_SLOT_PRE_ALERTS_TOP: ${VITE_ADSENSE_SLOT_PRE_ALERTS_TOP:-}
        VITE_ADSENSE_SLOT_PRE_ALERTS_BOTTOM: ${VITE_ADSENSE_SLOT_PRE_ALERTS_BOTTOM:-}
        VITE_ADSENSE_SLOT_ALERTS_RUNNER_TOP: ${VITE_ADSENSE_SLOT_ALERTS_RUNNER_TOP:-}
        VITE_ADSENSE_SLOT_ALERTS_RUNNER_BOTTOM: ${VITE_ADSENSE_SLOT_ALERTS_RUNNER_BOTTOM:-}
        VITE_ADSENSE_SLOT_HALTS_TOP: ${VITE_ADSENSE_SLOT_HALTS_TOP:-}
        VITE_ADSENSE_SLOT_HALTS_BOTTOM: ${VITE_ADSENSE_SLOT_HALTS_BOTTOM:-}
        VITE_ADSENSE_SLOT_BID_ASK_TOP: ${VITE_ADSENSE_SLOT_BID_ASK_TOP:-}
        VITE_ADSENSE_SLOT_BID_ASK_BOTTOM: ${VITE_ADSENSE_SLOT_BID_ASK_BOTTOM:-}
        VITE_ADSENSE_SLOT_CONFIGURATION_TOP: ${VITE_ADSENSE_SLOT_CONFIGURATION_TOP:-}
        VITE_ADSENSE_SLOT_CONFIGURATION_BOTTOM: ${VITE_ADSENSE_SLOT_CONFIGURATION_BOTTOM:-}
    image: rocketscreenersvitejs:latest
    container_name: rocketscreeners
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - proxy

networks:
  proxy:
    external: true
